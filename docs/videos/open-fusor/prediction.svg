<text x="927.3" y="311.9" font-size="11" fill="#0b0b0b">15 cm HDPE</text><text x="80" y="450" font-size="11" fill="#52514e">vcad-kernel-particle + vcad-kernel-neutronics, examples/open_fusor_poc.rs. Band = physics bracket, not a confidence interval; both edges omit the CX chain, volume ionization and beam–beam.</text><text x="80" y="466" font-size="11" fill="#52514e">Ceiling is not grid-converged (1.8→3.3→4.4×10⁵ n/s at h = 1/0.5/0.25 mm); floor converged to ~5%. Dose is neutron-only — no X-rays, no capture gammas, no room return.</text></svg>
