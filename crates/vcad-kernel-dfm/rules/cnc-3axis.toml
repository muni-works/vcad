schema = "vcad.dfm/1"
version = "1"
process = "cnc_3axis"
name = "Standard 3-axis aluminum"
notes = "Defaults assume a 6 mm minimum end mill with 50 mm flute length."

[rules.internal_radius_too_small]
severity = "warning"
min_internal_radius_mm = 3.0
fix = "raise_fillet_radius"

[rules.thin_wall]
severity = "error"
min_wall_mm = 1.0
# Walls thinner than this are sliver / folded tessellation debris, not walls.
artifact_tol_mm = 0.05
fix = "thicken_wall"

# Setup plan: the fewest of these tool axes that reach every reachable face
# is reported once (`cnc.setups`, info up to max_setups, warning above).
# Only features reachable from none of them are errors.
[rules.tool_inaccessibility]
severity = "error"
axes = ["+z", "-z", "+x", "-x", "+y", "-y"]
max_setups = 3
# Unreachable area below this (mm²) is ignored as tessellation noise.
min_unreachable_area_mm2 = 0.05
# Faces smaller than this (mm²) are boolean debris: grouped, never sampled.
sliver_area_mm2 = 0.001
fix = "manual"
