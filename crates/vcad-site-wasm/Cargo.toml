[package]
name = "vcad-site-wasm"
description = "Slim kernel WASM for the vcad.io landing demos (modeling only)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# a cdylib for the vcad.io landing site, built by www/scripts/build-site-kernel.sh
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# geometry only: no analysis solvers, no builtin font, no physics/ECAD/CAM
vcad-kernel = { path = "../vcad-kernel", version = "0.11.0", default-features = false, features = ["no-builtin-font"] }
vcad-kernel-tessellate = { workspace = true }
vcad-kernel-atoms = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = { workspace = true }
# transitive (via ahash/rand); wasm32-unknown-unknown needs the js backend
getrandom = { version = "0.2", features = ["js"] }
