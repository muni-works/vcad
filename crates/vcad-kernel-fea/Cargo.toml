[package]
name = "vcad-kernel-fea"
description = "Static structural FEA on BRep geometry: lattice tet fill of the tessellated interior, linear-elastic solve (PCG), von Mises / displacement / safety-factor QoIs with fail-closed mesh-convergence gating"
readme = "README.md"
keywords = ["cad", "kernel", "fea", "brep", "geometry"]
categories = ["science", "simulation", "mathematics"]
include = ["src/**/*", "README.md", "examples/**/*"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
vcad-kernel-tessellate = { workspace = true }
vcad-receipt = { workspace = true }
tang = { workspace = true }
tang-compile = { workspace = true }
tang-expr = { workspace = true }
tang-sparse = { workspace = true }

# Fill-reducing sparse Cholesky (AMD + supernodal) for the modal solver's
# exact preconditioner once the RCM skyline profile outgrows its budget.
# Native only: the wasm build keeps the skyline → IC0 → Jacobi chain.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "sparse-linalg"] }

[dev-dependencies]
serde_json = { workspace = true }
