[package]
name = "vcad-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI bridge exposing the vcad kernel to native apps (Swift/Apple)."

[lib]
name = "vcad_ffi"
# staticlib: the `.a` a Swift/Xcode app links. rlib: lets us unit-test the crate.
crate-type = ["staticlib", "rlib"]

[features]
default = ["no-builtin-font", "recon"]
# Experimental image to CAD (irys-recon): photos with a tag36h11 AprilTag in
# frame -> an editable, parametric document (`vcad_recon_*`).
recon = ["dep:irys-recon"]
# A native CAD app doesn't render with the kernel's builtin font — keep it out
# of the static lib rather than paying ~27 KB for an unused embed.
no-builtin-font = ["vcad-kernel/no-builtin-font"]

[dependencies]
vcad-kernel-cam = { workspace = true }
vcad-kernel-acoustics = { workspace = true }
vcad-sound = { workspace = true }
vcad-slicer = { workspace = true }
vcad-slicer-gcode = { workspace = true }
vcad-slicer-bambu = { workspace = true }
vcad-printcheck = { workspace = true }
vcad-kernel = { workspace = true }
vcad-kernel-drafting = { workspace = true }
vcad-kernel-naming = { workspace = true }
vcad-kernel-urdf = { workspace = true }
vcad-kernel-assembly = { workspace = true }
vcad-kernel-physics = { workspace = true }
vcad-sim = { workspace = true }
serde = { workspace = true }
vcad-kernel-tessellate = { workspace = true }
vcad-kernel-math = { workspace = true }
vcad-kernel-raytrace = { workspace = true, features = ["gpu"] }
vcad-kernel-gpu = { workspace = true }
pollster = { workspace = true }
vcad-eval = { workspace = true }
vcad-app = { workspace = true }
vcad-crdt = { workspace = true }
vcad-ir = { workspace = true }
vcad-receipt-verify = { workspace = true }
vcad-loon = { workspace = true }
vcad-mcp = { workspace = true }
vcad-ecad-pcb = { workspace = true }
vcad-ecad-symbols = { workspace = true }
vcad-ecad-schematic = { workspace = true }
vcad-ecad-export = { workspace = true }
vcad-ecad-fabprep = { workspace = true }
vcad-ecad-sim = { workspace = true }
vcad-kernel-enclosure = { workspace = true }
vcad-kernel-export = { workspace = true }
# `vcad render --photoreal`, linked in so the app needs no vcad-render binary.
vcad-render = { path = "../vcad-render", default-features = false, features = ["photoreal-gpu"] }
serde_json = { workspace = true }
irys-recon = { workspace = true, optional = true }

[dev-dependencies]
# Draws the tag36h11 test photos (recon tests).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
