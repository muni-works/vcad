name: WASM refresh

# Single writer for the generated kernel-wasm artifacts.
#
# wasm-pack output is not byte-reproducible, so two branches that each
# rebuilt packages/kernel-wasm/vcad_kernel_wasm* conflict on every merge
# even when their Rust changes don't overlap. Feature branches therefore
# never commit those files (ci.yml's wasm-artifact-guard enforces it);
# instead this workflow rebuilds them on main after any kernel-source
# merge and lands the refresh itself, once CI has verified it.
#
# The refresh commit only touches packages/kernel-wasm/**, which does not
# match the paths filter below — so it can never re-trigger itself.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      # loon stdlib is include_str! into crates/vcad-loon
      - "lib/**"
      - "Cargo.toml"
      - "Cargo.lock"
  # Manual re-fire for the rare push race (a merge landing between this
  # workflow's checkout and its push makes the push fail cleanly).
  workflow_dispatch: {}

permissions:
  contents: write
  # dispatch + watch the CI run that gates the refresh commit
  actions: write

concurrency:
  group: wasm-refresh-main
  # Only the newest kernel state matters — a superseded rebuild is waste.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # mac CI on the refresh commit can take ~90 min
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Clone sibling repos
        run: |
          git clone --depth 1 https://github.com/ecto/tang.git ../tang
          git clone --depth 1 https://github.com/ecto/phyz.git ../phyz
          git clone --depth 1 https://github.com/ecto/loon.git ../loon
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Install wasm-pack
        # Via cargo so the binary comes through the same trust chain as the
        # rest of the toolchain (matches ci.yml).
        run: cargo install wasm-pack --locked --version 0.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # node_modules is needed for the builtin font include_bytes! in
      # vcad-kernel-text; --ignore-scripts skips native builds we don't use.
      - run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts
      # build.mjs (not raw wasm-pack): it also re-applies the trap-recovery
      # hook to the wasm-bindgen glue, which the checked-in artifacts carry.
      - name: Rebuild kernel WASM artifacts
        run: node packages/kernel-wasm/scripts/build.mjs
      - name: Commit refreshed artifacts
        id: commit
        run: |
          git add packages/kernel-wasm/vcad_kernel_wasm.js \
                  packages/kernel-wasm/vcad_kernel_wasm.d.ts \
                  packages/kernel-wasm/vcad_kernel_wasm_bg.wasm \
                  packages/kernel-wasm/vcad_kernel_wasm_bg.wasm.d.ts
          if git diff --cached --quiet; then
            echo "artifacts unchanged — nothing to refresh"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "vcad-agent[bot]"
          git config user.email "vcad-agent@users.noreply.github.com"
          git commit -m "chore(wasm): refresh kernel artifacts for ${GITHUB_SHA:0:7}"
          # The build can dirty tracked files this job doesn't own — most
          # commonly Cargo.lock, when a PR pinned a sibling-repo version from
          # a stale local checkout. Single-writer policy: this job only ever
          # commits the kernel-wasm artifacts, so surface the drift as a
          # warning and discard it (see #469→#473).
          if ! git diff --quiet; then
            echo "::warning::discarding non-artifact build dirt (stale sibling pin in a merged PR?):"
            git --no-pager diff --stat
            git checkout -- .
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # main's branch protection requires Rust (stable), TypeScript and
      # Swift (macOS) to pass on a commit before it can land, so a bare
      # `git push origin HEAD:main` is rejected (GH006 — every run failed
      # from 2026-11-07 until this change). Instead: park the commit on a
      # bot branch, run the full CI workflow against it (workflow_dispatch
      # runs report the same required check names), and only fast-forward
      # main to that exact SHA once CI is green. No protection bypass, and
      # no PR needed (Actions may not create PRs in this repo).
      - name: Verify refresh with CI, then fast-forward main
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git push --force origin "$SHA:refs/heads/bot/wasm-refresh"
          gh workflow run ci.yml --ref bot/wasm-refresh
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow ci.yml --branch bot/wasm-refresh \
                       --event workflow_dispatch --json databaseId,headSha \
                       --jq "map(select(.headSha == \"$SHA\")) | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::CI run for $SHA never appeared"; exit 1
          fi
          echo "verifying via CI run $run_id"
          gh run watch "$run_id" --exit-status --interval 60 > /dev/null
          # Fast-forward only. If a merge landed on main meanwhile, this
          # rebuild is stale anyway — that merge's own push event re-fires
          # this workflow if it touched kernel sources; otherwise re-dispatch.
          if ! git push origin "$SHA:refs/heads/main"; then
            echo "::warning::main moved during verification — re-dispatching a fresh refresh"
            gh workflow run wasm-refresh.yml --ref main
            exit 0
          fi
          git push origin --delete bot/wasm-refresh || true
