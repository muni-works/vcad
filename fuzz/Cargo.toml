[package]
name = "vcad-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
stepperoni = { path = "../crates/stepperoni" }
vcad-kernel-step = { path = "../crates/vcad-kernel-step" }
